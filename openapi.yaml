info:
  title: Serchat API
  description: The Serchat API description
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    LoginRequestDTO:
      type: object
      properties:
        login:
          type: string
        password:
          type: string
      required:
        - login
        - password
    LoginResponseDTO:
      type: object
      properties:
        token:
          type: string
        temp_token:
          type: string
        two_factor_required:
          type: boolean
        username:
          type: string
      required:
        - username
    TotpSetupResponseDTO:
      type: object
      properties:
        otpauthUri:
          type: string
      required:
        - otpauthUri
    TotpSetupConfirmRequestDTO:
      type: object
      properties:
        code:
          type: string
          description: 6 digit code from authenticator app
      required:
        - code
    TotpSetupConfirmResponseDTO:
      type: object
      properties:
        backupCodes:
          type: array
          items:
            type: string
        token:
          type: string
      required:
        - backupCodes
    TotpVerifyRequestDTO:
      type: object
      properties:
        tempToken:
          type: string
        code:
          type: string
          description: 6 digit authenticator code
        backupCode:
          type: string
          description: Backup code in XXXX-XXXX format
      required:
        - tempToken
    TotpSensitiveActionRequestDTO:
      type: object
      properties:
        code:
          type: string
        backupCode:
          type: string
    RegisterRequestDTO:
      type: object
      properties:
        login:
          type: string
          example: user@example.com
        username:
          type: string
        password:
          type: string
        invite:
          type: string
      required:
        - login
        - username
        - password
        - invite
    RegisterResponseDTO:
      type: object
      properties:
        token:
          type: string
      required:
        - token
    ChangeLoginRequestDTO:
      type: object
      properties:
        newLogin:
          type: string
        password:
          type: string
      required:
        - newLogin
        - password
    ChangeLoginResponseDTO:
      type: object
      properties:
        message:
          type: string
        login:
          type: string
        token:
          type: string
      required:
        - message
        - login
        - token
    ChangePasswordRequestDTO:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
      required:
        - currentPassword
        - newPassword
    ChangePasswordResponseDTO:
      type: object
      properties:
        message:
          type: string
        token:
          type: string
      required:
        - message
        - token
    PasswordResetRequestDTO:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
      required:
        - email
    PasswordResetResponseDTO:
      type: object
      properties:
        message:
          type: string
        requestId:
          type: string
          description: Request ID for support reference
          example: a1b2c3d4e5f6g7h8
      required:
        - message
        - requestId
    PasswordResetConfirmDTO:
      type: object
      properties:
        token:
          type: string
        newPassword:
          type: string
          minLength: 8
      required:
        - token
        - newPassword
    BlockProfileResponseDTO:
      type: object
      properties:
        id:
          type: string
          example: 60d0fe4f5311236168a109ca
        name:
          type: string
          example: Mute and hide
        flags:
          type: number
          example: 1024
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - flags
        - createdAt
        - updatedAt
    CreateBlockProfileRequestDTO:
      type: object
      properties:
        name:
          type: string
          description: Name of the block profile
          example: Mute and hide
        flags:
          type: number
          description: 15-bit bitmask of flags
          example: 1024
          minimum: 0
          maximum: 32767
      required:
        - name
        - flags
    UpdateBlockProfileRequestDTO:
      type: object
      properties:
        name:
          type: string
          description: New name of the block profile
          example: Strict Block
        flags:
          type: number
          description: New 15-bit bitmask of flags
          example: 32767
          minimum: 0
          maximum: 32767
    BlockRelationshipResponseDTO:
      type: object
      properties:
        targetUserId:
          type: string
          example: 60d0fe4f5311236168a109cb
        targetUsername:
          type: string
          example: BlockedUser
        profileId:
          type: string
          example: 60d0fe4f5311236168a109ca
        flags:
          type: number
          example: 1024
      required:
        - targetUserId
        - targetUsername
        - profileId
        - flags
    UpsertBlockRelationshipRequestDTO:
      type: object
      properties:
        profileId:
          type: string
          description: ID of the block profile to apply
          example: 60d0fe4f5311236168a109ca
      required:
        - profileId
    DashBoardStatsDTO:
      type: object
      properties:
        users:
          type: number
        usersSparkline:
          type: array
          items:
            type: number
        activeUsers:
          type: number
        activeUsersSparkline:
          type: array
          items:
            type: number
        bans:
          type: number
        bansSparkline:
          type: array
          items:
            type: number
        servers:
          type: number
        serversSparkline:
          type: array
          items:
            type: number
        messages:
          type: number
        messagesSparkline:
          type: array
          items:
            type: number
      required:
        - users
        - usersSparkline
        - activeUsers
        - activeUsersSparkline
        - bans
        - bansSparkline
        - servers
        - serversSparkline
        - messages
        - messagesSparkline
    AdminUserListItemDTO:
      type: object
      properties:
        _id:
          type: string
        username:
          type: string
        login:
